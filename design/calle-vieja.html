<!doctype html><html lang="es"><meta charset="utf-8"><title>Calle Vieja · Vista del mapa integrado</title><style>body{background:#222b29;color:#eee;font:18px system-ui;margin:24px}canvas{image-rendering:pixelated;width:100%;max-width:1280px}label{display:inline-block;margin:12px}select{font:inherit}</style><h1>Calle Vieja · Jiménez → Guápiles</h1><p>Vista de los assets y la geometría reales. Sin sesiones, conexiones ni cambios al progreso.</p><label>Tramo <select id="part"><option value="0">1 · Jiménez</option><option value="1">2 · Calle Vieja</option><option value="2">3 · Antes de Guápiles</option></select></label><label>Posición oeste → este <input id="x" type="range" min="0" max="300" value="260"></label><canvas id="map" width="1280" height="768"></canvas><p id="status">Cargando</p><script type="module">
import {WorldRenderer} from '../src/world-renderer.js';
const zones=await(await fetch('./calle-vieja.json')).json(),r=new WorldRenderer();await r.loaded;const c=document.querySelector('canvas'),ctx=c.getContext('2d');
function render(){const z=zones[document.querySelector('#part').value],x=Number(document.querySelector('#x').value)*16;r.setZone(z);ctx.setTransform(2,0,0,2,-x*2,-19*16*2);r.draw(ctx,{x,y:19*16,w:640,h:384},[],0);document.querySelector('#status').textContent=z.subtitle;}
for(const e of document.querySelectorAll('input,select'))e.addEventListener('input',render);render();
</script></html>
