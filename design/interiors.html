<!doctype html><html lang="es"><meta charset="utf-8"><title>Interiores · Geometría integrada</title><style>body{background:#252a30;color:#f4efd9;font:18px system-ui;margin:24px}canvas{image-rendering:pixelated;width:640px;max-width:100%}select{font:inherit;margin:16px 0}</style><h1>Interiores de Jiménez y Calle Vieja</h1><p>Vista estática de la geometría y los recursos originales del juego. Sin cuentas ni conexiones.</p><select aria-label="Interior" id="room"></select><br><canvas width="640" height="512"></canvas><script type="module">
import {WorldRenderer} from '../src/world-renderer.js';const rooms=await(await fetch('./interiors.json')).json(),select=document.querySelector('select'),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),r=new WorldRenderer();await r.loaded;
for(const [i,room] of rooms.entries()){const o=document.createElement('option');o.value=i;o.textContent=`${room.name} (${room.id})`;select.append(o);}select.value=rooms.findIndex(r=>r.kind==='medical');
function show(){const room=rooms[select.value];r.setZone(room);ctx.setTransform(2,0,0,2,0,0);r.draw(ctx,{x:0,y:0,w:320,h:256},[],0,null,false);}select.addEventListener('change',show);const frame=()=>{show();requestAnimationFrame(frame);};frame();
</script></html>
