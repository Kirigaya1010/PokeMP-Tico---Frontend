<g font-family="system-ui,sans-serif" fill="#132b20" font-size="15" font-weight="bold" text-anchor="middle">
<text x="663" y="178">Cancha</text><text x="676" y="347">Parque · inicio</text><text x="671" y="554">Iglesia</text><text x="389" y="358">Escuela</text><text x="190" y="358">Cementerio</text><text x="185" y="153">Viviendas del norte</text><text x="185" y="481">Viviendas del suroeste</text><text x="818" y="170">Sector residencial</text>
<text x="494" y="355" fill="#f8edcc">Centro médico*</text><text x="494" y="500" fill="#f8edcc">Tienda*</text><text x="808" y="466">Paseo*</text>
<text x="198" y="331">Calle Vieja</text><text x="589" y="596" transform="rotate(-90 589 596)">Ruta 810</text><text x="991" y="478" transform="rotate(-75 991 478)">Río Jiménez</text><text x="132" y="696">← Guápiles</text><text x="555" y="689">Ruta 32</text><text x="997" y="681">Guácimo →</text><text x="1044" y="130" fill="#eef1d8">↑ N</text>
</g>
<g font-family="system-ui,sans-serif" fill="#eaf0df" font-size="14"><text x="35" y="767">* Ubicaciones y paseo propuestos para el juego; pendientes de tu aprobación.</text><text x="35" y="790">Más detalle: patios, accesos, jardines, bancas, rótulos y vegetación agrupada; sin nuevos servicios o mecánicas.</text><text x="35" y="814" fill="#b8cab7">Plano de distribución. Fachadas, terreno final y geometría online todavía no están integrados.</text></g>
</svg>
